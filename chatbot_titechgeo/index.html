<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assistente TITECHGEO</title>
<style>
:root{--navy:#123b54;--teal:#15977f;--bg:#f4f7f9;--ink:#172b38}
*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;color:var(--ink)}
#launcher{position:fixed;right:22px;bottom:22px;border:0;border-radius:50px;background:var(--navy);color:white;padding:15px 20px;box-shadow:0 5px 22px #0003;cursor:pointer;font-weight:700}
#chat{display:none;position:fixed;right:22px;bottom:86px;width:min(380px,calc(100vw - 28px));height:min(590px,calc(100vh - 115px));background:white;border-radius:18px;box-shadow:0 10px 40px #0003;overflow:hidden;flex-direction:column}
header{background:var(--navy);color:white;padding:17px;display:flex;align-items:center;gap:12px}
.logo{width:39px;height:39px;border-radius:12px;background:white;color:var(--navy);display:grid;place-items:center;font-weight:bold}
header strong{display:block}header small{color:#cce5ed}.close{margin-left:auto;background:none;border:0;color:white;font-size:23px;cursor:pointer}
#messages{padding:15px;overflow:auto;flex:1;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.msg{padding:11px 13px;border-radius:14px;max-width:88%;line-height:1.4;white-space:pre-wrap}
.bot{background:white;align-self:flex-start;border:1px solid #e5eaed}.user{background:#d9f2eb;align-self:flex-end}
#suggestions{padding:9px 12px;display:flex;gap:7px;overflow:auto;background:white}
#suggestions button{white-space:nowrap;border:1px solid #cbd8de;background:white;border-radius:20px;padding:7px 10px;cursor:pointer;color:var(--navy)}
form{display:flex;padding:12px;gap:8px;border-top:1px solid #e5eaed}
input{min-width:0;flex:1;border:1px solid #ccd6dc;border-radius:22px;padding:12px;outline-color:var(--teal)}
form button{border:0;border-radius:50%;width:43px;background:var(--teal);color:white;font-size:18px;cursor:pointer}
.note{text-align:center;font-size:10px;color:#71818a;padding:0 8px 8px}
</style>
</head>
<body>
<button id="launcher" aria-label="Abrir atendimento">💬 Fale com a TITECHGEO</button>
<section id="chat" aria-label="Chat de atendimento">
<header><div class="logo">TG</div><div><strong>Assistente TITECHGEO</strong><small>Atendimento virtual</small></div><button class="close" id="close" aria-label="Fechar">×</button></header>
<div id="messages" aria-live="polite"><div class="msg bot">Olá! 👋 Sou o assistente virtual da TITECHGEO. Posso explicar nossos serviços, mostrar exemplos e ajudar você a solicitar um orçamento. Como posso ajudar?</div></div>
<div id="suggestions">
<button>Análise de dados</button><button>Geoprocessamento</button><button>Acessibilidade e UX/UI</button><button>Outros serviços</button><button>Solicitar orçamento</button>
</div>
<form id="form"><input id="question" placeholder="Digite sua pergunta..." autocomplete="off" required><button aria-label="Enviar">➤</button></form>
<div class="note">As respostas são geradas por IA. Confirme prazos e condições com a equipe.</div>
</section>
<script>
/* Depois de publicar o backend, substitua pela URL HTTPS dele. */
const API_URL = "https://SEU-SERVIDOR.com/chat";
const chat=document.querySelector("#chat"), launcher=document.querySelector("#launcher");
const messages=document.querySelector("#messages"), input=document.querySelector("#question");
let history=[];
launcher.onclick=()=>{chat.style.display="flex";launcher.style.display="none";input.focus()};
document.querySelector("#close").onclick=()=>{chat.style.display="none";launcher.style.display="block"};
function add(text,who){const el=document.createElement("div");el.className="msg "+who;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;return el}
async function send(text){
 if(!text.trim())return;
 add(text,"user");history.push({role:"user",content:text});input.value="";
 const pending=add("Estou consultando as informações da TITECHGEO...","bot");
 try{
  const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,history:history.slice(-10)})});
  if(!res.ok)throw new Error("HTTP "+res.status);
  const data=await res.json();pending.textContent=data.reply||"Não consegui gerar uma resposta.";
  history.push({role:"assistant",content:pending.textContent});
 }catch(e){pending.textContent="Não consegui conectar ao atendimento inteligente neste momento. Você pode falar com a equipe pelos e-mails titechgeo@gmail.com ou ngsneto@gmail.com."}
}
document.querySelector("#form").onsubmit=e=>{e.preventDefault();send(input.value)};
document.querySelectorAll("#suggestions button").forEach(b=>b.onclick=()=>send(b.textContent));
</script>
</body></html>
