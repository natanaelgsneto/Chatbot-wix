services:
  - type: web
    name: chatbot-titechgeo
    runtime: python
    plan: free
    rootDir: chatbot_titechgeo
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: WIX_ORIGIN
        value: https://titechgeo.wixsite.com
